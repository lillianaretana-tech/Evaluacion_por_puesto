<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SBM V7.4 Campo · Assessment Integral Multirrol</title><style>
:root{--b:#173b67;--b2:#245a98;--bg:#f4f7fb;--line:#d8e0ea;--txt:#10233c;--g:#16784a;--w:#a96500;--r:#b42318;--soft:#eaf1f8}*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;font-size:15px;background:var(--bg);color:var(--txt)}
header{background:var(--b);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:20px}header p{margin:4px 0 0;font-size:12px;opacity:.9}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}.hb{background:transparent;color:#fff;border:1px solid #ffffff88;border-radius:8px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer}.hb.on{background:#ffffff26;border-color:#fff}
.wrap{max-width:1220px;margin:20px auto;padding:0 14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #173b6710}
h2,h3{color:var(--b)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.field label,.lbl{font-size:12px;font-weight:700;display:block;margin-bottom:5px}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;padding:10px;border:1px solid #b8c5d5;border-radius:8px;font:inherit}textarea{min-height:100px}
:focus-visible{outline:3px solid #245a98;outline-offset:1px}
.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--b);color:#fff;font-size:14px}.btn.small{padding:6px 9px;font-size:12px}
.secondary{background:#fff;color:var(--b);border:1px solid var(--b)}.danger{background:#fff;color:var(--r);border:1px solid var(--r)}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.nav .btn{font-size:12px;padding:8px 10px}.active{background:var(--b2)!important;color:#fff!important}
.progress{height:6px;background:#dbe5f0;border-radius:4px;margin-bottom:14px;overflow:hidden}.progress>div{height:100%;background:var(--g);transition:width .3s}
.scenario,.steps,.note{padding:13px;border-radius:9px;margin:10px 0}.scenario{background:#f7f9fc;border-left:5px solid var(--b2)}.steps,.note{background:#eef4fb;border:1px solid #c8d8ea}
.q{border-top:1px solid var(--line);padding:15px 0}.opts label{display:block;padding:7px;border-radius:6px;cursor:pointer}.opts label:hover{background:#f3f7fc}
.helpgrid{display:grid;grid-template-columns:1fr 200px;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hidden{display:none!important}.pill,.tag{display:inline-block;border-radius:15px;padding:3px 8px;font-size:11px;font-weight:700}.pill{background:var(--soft)}
.good{color:var(--g)}.warn{color:var(--w)}.bad{color:var(--r)}.muted{font-size:12px;color:#5d6b7b}.err{color:var(--r);font-weight:700;margin-top:6px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:var(--b);color:#fff;text-align:left;padding:9px}td{border:1px solid var(--line);padding:8px;vertical-align:top}
.tscroll{overflow-x:auto}.feedback{border-left:4px solid #d7e2ee;padding:9px 12px;margin:8px 0;background:#fafbfd}
.detail{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:12px 0}.detail h4{margin:0;padding:10px 12px;background:#eef4fb;color:var(--b)}.detail .body{padding:12px}
.evpanel{border:2px dashed var(--b2);border-radius:12px;padding:14px;margin-top:18px;background:#f4f9ff}
.evq{font-size:13px;background:#f1f6fb;border-left:4px solid var(--b2);padding:6px 10px;margin-top:8px}
.rubrow{display:grid;grid-template-columns:1fr 210px;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.banner{padding:12px 14px;border-radius:9px;margin:10px 0;border:1px solid}.banner.ok{background:#e8f6ee;border-color:#9fd3b6}.banner.pend{background:#fff6e5;border-color:#efc77a}
.hm td{text-align:center;font-weight:700;min-width:54px}.c-good{background:#dff3e8;color:var(--g)}.c-bad{background:#fde7e4;color:var(--r)}.c-warn{background:#fff1d6;color:var(--w)}.c-na{background:#f0f2f5;color:#8a95a3}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}.mbox{background:#fff;border-radius:14px;padding:22px;max-width:420px;width:100%}
.chk{display:flex;gap:8px;align-items:flex-start;margin:10px 0}.chk input{margin-top:3px}
@media(max-width:700px){.helpgrid,.rubrow{grid-template-columns:1fr}.card{padding:14px}header{padding:12px}}
@media print{header,.nav,.progress,.actions,.no-print,#warn{display:none!important}.wrap{max-width:none;margin:0}.card{box-shadow:none;border:0}.detail{break-inside:avoid}body{background:#fff}input,select,textarea{border:0!important;padding:0!important}}
</style></head><body>

<script>
const PUB={"M":[["excel","Excel",35],["comm","Comunicación",15],["docs","Documentación",20],["kpi","Indicadores/KPI",20],["quality","Calidad/ISO",15],["admin","Administración",15],["finance","Presupuesto",20],["people","Personas/Onboarding",15],["lead","Liderazgo",20],["client","Cliente",20],["ehs","Seguridad/EHS",15],["ops","Gestión Operativa",20],["scope","Contrato/Scope",20]],"ROLE":{"leader":{"label":"Líder","mods":["comm","quality","people","lead","ehs","ops"],"req":{"comm":2,"quality":2,"people":2,"lead":2,"ehs":2,"ops":2}},"supervisor":{"label":"Supervisor","mods":["excel","comm","docs","kpi","quality","admin","people","lead","client","ehs","ops","scope"],"req":{"excel":2,"comm":3,"docs":3,"kpi":2,"quality":3,"admin":2,"people":3,"lead":3,"client":2,"ehs":3,"ops":3,"scope":2}},"coordinator":{"label":"Coordinador","mods":["excel","comm","docs","kpi","quality","admin","finance","people","lead","client","ehs","ops","scope"],"req":{"excel":3,"comm":3,"docs":3,"kpi":3,"quality":3,"admin":3,"finance":2,"people":3,"lead":3,"client":3,"ehs":3,"ops":3,"scope":3}},"pm":{"label":"Project Manager","mods":["excel","comm","docs","kpi","quality","admin","finance","people","lead","client","ehs","ops","scope"],"req":{"excel":3,"comm":3,"docs":3,"kpi":4,"quality":4,"admin":4,"finance":4,"people":4,"lead":4,"client":4,"ehs":3,"ops":4,"scope":4}}},"NEXT":{"leader":"supervisor","supervisor":"coordinator","coordinator":"pm"},"excelQ":["Filtre únicamente Uber. ¿Cuántos registros quedan visibles?","Dentro de Uber, ¿cuántos registros tienen tardía mayor a 10 minutos?","Calcule el porcentaje de ausencias de DXC. Escriba el porcentaje con 1 decimal. Ejemplo: si obtiene 0.042, escriba 4.2.","¿Qué proyecto acumula más horas extra?","Calcule el promedio de Calidad % de MCK (1 decimal).","¿Cuántos Líderes o Supervisores tienen Capacitación % menor a 85?","Cree Estado puntualidad según las instrucciones. ¿Cuántos registros quedaron como Crítica?","Ordene Tardía de mayor a menor. ¿Cuál es la tardía máxima y cuántos colaboradores tienen ese mismo valor? Escriba: máximo, cantidad.","Prepare el resumen por proyecto solicitado. ¿Qué proyecto tiene más ausencias y cuántas? Escriba: proyecto, cantidad.","¿Qué proyecto revisaría primero y por qué? Use al menos dos datos del archivo."],"plan":{"excel":"Práctica guiada con datos reales del proyecto (filtros, SI, CONTAR.SI, tabla dinámica): dos ejercicios por semana revisados por el evaluador.","comm":"Redactar tres correos de incidencia reales con revisión del PM, usando la estructura: qué pasó / qué se hizo / estado / siguiente control.","docs":"Taller de control documental (versiones, histórico, confidencialidad) y auditoría de la carpeta de su sitio con lista de verificación.","kpi":"Análisis guiado de los KPI del sitio de los últimos 3 meses: relacionar indicadores y proponer un plan de 7 días con el PM.","quality":"Caso práctico de acción correctiva ISO 9001 (causa raíz, 5 porqués) sobre una no conformidad real, con verificación de eficacia.","admin":"Matriz de priorización por riesgo (seguridad, continuidad, cliente, vencimiento) aplicada a la lista real de pendientes semanales.","finance":"Lectura de presupuesto vs real con el PM: calcular variaciones y explicar los drivers de dos cierres mensuales.","people":"Acompañamiento en onboarding y conversaciones de seguimiento (tardías, desempeño) con guía de retroalimentación y registro.","lead":"Simulación de priorización de turno con casos críticos y mentoría con un supervisor/coordinador con experiencia.","client":"Role-play de respuesta a cliente (incumplimiento + solicitud fuera de scope) y revisión del correo con el PM.","ehs":"Recorrido de inspección EHS con el responsable del sitio y refuerzo de controles de piso, químicos y PPE.","ops":"Diseño de planes de cobertura ante ausencias con casos reales; revisión de las decisiones con el coordinador/PM.","scope":"Lectura guiada del contrato/scope del sitio y ejercicio de impacto de cambio (horas, frecuencia, costo)."},"defs":{"excel":{"title":"Excel Operativo","scenario":"","qs":[],"rub":["Elige un proyecto defendible","Sustenta con al menos 2 datos del archivo"]},"comm":{"title":"Comunicación Profesional","scenario":"Debe comunicar una incidencia de servicio a su PM. El cliente ya la conoce y espera seguimiento.","qs":[{"id":"cm1","t":"m","p":"¿Cuál mensaje es más completo?","o":["Con relación a la incidencia, el equipo trabajó de inmediato y se aplicaron las medidas del protocolo; quedo atento a cualquier consulta.","Se detectó la incidencia a las 9:10; se contuvo el área y se reasignó cobertura. Estado: controlada. Enviaré el cierre con evidencia a las 11:00.","Se detectó la incidencia a las 9:10 y se contuvo el área. Le avisaré cuando el equipo termine de resolverla por completo.","Incidencia atendida desde las 9:10 por el equipo. El área ya está controlada y no se prevén más afectaciones en el sitio."]},{"id":"cm2","t":"t","p":"Redacte un correo breve de cierre: qué pasó, qué se hizo, estado actual y siguiente control."}],"rub":["Claridad y orden","Datos verificables","Acción y seguimiento","Tono profesional"]},"docs":{"title":"Gestión Documental","scenario":"Encuentra una versión vigente fuera de la carpeta controlada, una versión vencida en la carpeta activa y una evidencia sin fecha.","qs":[{"id":"d1","t":"m","p":"¿Qué hace primero?","o":["Consolida ambas versiones en un solo archivo actualizado para evitar duplicados y lo guarda en la carpeta controlada.","Mueve la versión vencida a una carpeta de archivo y avisa al equipo para que busquen cuál es la vigente.","Confirma cuál es la versión vigente, la deja en la carpeta controlada y mueve la obsoleta a histórico con registro del cambio.","Copia la versión vigente a la carpeta controlada y deja la vencida donde está hasta la próxima revisión documental."]},{"id":"d2","t":"m","p":"Un reporte de incidente con datos personales está en una carpeta general. ¿Qué corresponde?","o":["Anonimizar el nombre del archivo y mantener el documento en la carpeta general para facilitar las auditorías.","Eliminar el archivo de la carpeta general y conservar solo una impresión firmada en el archivo físico.","Moverlo a una ubicación de acceso restringido según el control documental, conservando la trazabilidad del movimiento.","Dejarlo en la carpeta general y avisar por correo a los usuarios que no deben abrirlo."]},{"id":"d3","t":"t","p":"Explique cómo cerraría una evidencia que no tiene fecha, responsable ni confirmación de cierre."}],"rub":["Control de versión","Trazabilidad","Confidencialidad","Cierre de evidencia"]},"kpi":{"title":"Indicadores y Plan de Acción","scenario":"En tres meses Quality baja 94→90→86; CSAT 4.6→4.2→3.8; ausentismo 3%→5%→8%; OT 6%→9%→14%. Safety permanece en meta.","qs":[{"id":"k1","t":"m","p":"¿Cuál lectura integra mejor los datos?","o":["El problema principal es la calidad de la ejecución; conviene reforzar la capacitación y las auditorías porque Safety se mantiene en meta.","Hay un deterioro de servicio y de percepción del cliente asociado a presión de cobertura; hay que investigar ausencias, rutas y uso de OT antes de actuar.","Los cuatro indicadores empeoran, así que conviene actuar sobre todos a la vez con un plan general, sin buscar causas específicas.","El aumento de OT es la causa; conviene limitarlo para recuperar el control de costos y luego medir si mejora la calidad."]},{"id":"k2","t":"t","p":"Proponga 3 acciones para 7 días e indique qué evidencia revisaría para confirmar la causa."}],"rub":["Relaciona indicadores","Busca causa antes de concluir","Acciones concretas","Seguimiento medible"]},"quality":{"title":"Calidad e ISO 9001","scenario":"Una auditoría obtiene 88%. Los mismos dos puntos fallaron en las últimas tres semanas y el equipo los corrige solo antes de cada auditoría.","qs":[{"id":"q1","t":"m","p":"¿Cuál es la mejor acción?","o":["Reforzar la corrección previa a cada auditoría y registrar que los puntos se resolvieron antes de la fecha de revisión.","Analizar la causa de la recurrencia, definir una acción correctiva con responsable y fecha, y verificar su eficacia en las siguientes auditorías.","Capacitar al equipo sobre los dos puntos fallidos y volver a auditar la próxima semana para confirmar el resultado.","Aumentar la frecuencia de auditoría de esos dos puntos y reportar el porcentaje semanal al cliente."]},{"id":"q2","t":"t","p":"Describa qué evidencia usaría para demostrar que la acción fue eficaz, no solo ejecutada."}],"rub":["Distingue corrección de acción correctiva","Busca causa","Define evidencia","Verifica eficacia"]},"admin":{"title":"Administración del Proyecto","scenario":"Tiene ausencias, inventario crítico, una factura pendiente de respaldo y una capacitación vencida. No todo puede resolverse al mismo tiempo.","qs":[{"id":"a1","t":"m","p":"¿Qué criterio debe guiar la priorización?","o":["Urgencia que manifieste el cliente: primero lo que él haya pedido y luego lo que se pueda cerrar rápido.","Impacto económico: primero la factura pendiente, porque puede afectar la facturación y el flujo del proyecto.","Riesgo para seguridad, continuidad y cliente, junto con los vencimientos; el resto se programa con responsable y seguimiento.","Facilidad de cierre: resolver primero lo rápido para reducir la lista y liberar tiempo para lo complejo."]},{"id":"a2","t":"t","p":"Ordene las cuatro situaciones y explique brevemente su criterio."}],"rub":["Prioriza por riesgo","Controla pendientes","Asigna responsables","Conserva evidencia"]},"finance":{"title":"Presupuesto y Control Financiero","scenario":"Presupuesto aprobado ₡2.400.000. Mano de obra: presupuestado ₡1.500.000, gasto real ₡1.620.000. Suministros: ₡500.000 vs ₡470.000. Otros: ₡400.000 vs ₡405.000.","qs":[{"id":"f1","t":"m","p":"¿Cuál es la variación total?","o":["₡120.000 sobre presupuesto","₡95.000 sobre presupuesto","₡30.000 bajo presupuesto","₡155.000 sobre presupuesto"]},{"id":"f2","t":"m","p":"¿Qué rubro investigaría primero?","o":["El total: la variación de ₡95.000 es el dato que reportaría a gerencia antes de revisar rubros.","Suministros: bajaron 6% y podría significar menor consumo o servicio incompleto.","Mano de obra: es la desviación desfavorable más grande (+₡120.000, 8%).","Otros: suele tener menos control y una desviación pequeña puede esconder gastos no previstos."]},{"id":"f3","t":"t","p":"Indique dos preguntas que haría antes de proponer una reducción de costo."}],"rub":["Calcula variación","Identifica driver","Investiga causa","Evita recortes sin contexto"]},"people":{"title":"Personas y Onboarding","scenario":"Una persona nueva ya está en site, pero falta evidencia de una parte de su inducción. Otra colaboradora tiene tres tardías en dos semanas.","qs":[{"id":"p1","t":"m","p":"¿Qué hace con la inducción incompleta?","o":["Mantiene al colaborador en tareas de bajo riesgo hasta la próxima capacitación grupal y lo registra al terminar.","Pide al colaborador firmar la lista de inducción para regularizar el expediente y completa el contenido en la próxima rotación.","Registra la inducción como completada porque la persona ya trabaja con normalidad y no ha tenido incidentes.","Verifica qué requisito falta, lo completa de inmediato con fecha y responsable, y deja la evidencia en el expediente."]},{"id":"p2","t":"t","p":"Explique cómo abordaría las tardías: conversación, evidencia y seguimiento."}],"rub":["Cumplimiento de onboarding","No fabrica evidencia","Feedback claro","Seguimiento documentado"]},"lead":{"title":"Liderazgo y Priorización","scenario":"A las 8:10 hay un derrame sin aislar, dos ausencias, visita ejecutiva a las 9:00, conflicto entre dos colaboradoras y una tarea periódica vence hoy. No hay OT autorizada.","qs":[{"id":"l1","t":"m","p":"¿Qué atiende primero?","o":["Aislar y atender el derrame, y asegurar que el área quede segura antes de cualquier otra acción.","Reunirse con las dos colaboradoras en conflicto para que el problema no afecte la operación de la mañana.","Confirmar la cobertura de las dos ausencias para tener el equipo completo antes de la visita de las 9:00.","Ejecutar la tarea periódica que vence hoy para no incumplir y después preparar el área de la visita."]},{"id":"l2","t":"t","p":"Ordene las demás acciones y explique qué delegaría."},{"id":"l3","t":"t","p":"¿Cómo manejaría el conflicto sin descuidar la operación?"}],"rub":["Seguridad primero","Continuidad del servicio","Delegación","Manejo del conflicto","Escalamiento"]},"client":{"title":"Gestión del Cliente","scenario":"El cliente reporta un incumplimiento real y, en el mismo correo, pide una tarea diaria que el scope indica semanal.","qs":[{"id":"c1","t":"m","p":"¿Cuál enfoque es mejor?","o":["Atender el incumplimiento y explicar que la frecuencia diaria no está en el contrato, sin ofrecer alternativas.","Corregir el incumplimiento, confirmar el seguimiento al cliente y validar formalmente la tarea diaria antes de comprometerla.","Responder primero la solicitud diaria para mostrar disposición y gestionar el incumplimiento en la visita semanal.","Corregir el incumplimiento y aceptar la tarea diaria de forma temporal mientras se revisa el scope con el cliente."]},{"id":"c2","t":"t","p":"Redacte la respuesta al cliente."}],"rub":["Reconoce incumplimiento","Acción inmediata","Maneja expectativa","Protege scope","Cierra seguimiento"]},"ehs":{"title":"Seguridad / EHS","scenario":"Durante una rutina observa piso mojado sin señalización, un químico trasvasado sin etiqueta y una persona sin el PPE requerido.","qs":[{"id":"e1","t":"m","p":"¿Cuál es la mejor primera respuesta?","o":["Señalizar el piso y corregir primero el PPE; el químico sin etiqueta se resuelve al final del turno.","Documentar con fotos los tres hallazgos y escalar al responsable de EHS antes de intervenir.","Controlar de inmediato los tres riesgos, detener la exposición si corresponde y luego documentar y escalar.","Atender primero lo que ve el cliente (el piso) y reportar el resto en el informe semanal let CLOUD=null,REMOTE={},cloudMsg='',cloudErr=false,pushT=null;
let store=loadStore(),S=null,KEYS=null,EV=false,V={view:'home',mod:null},homeMsg='',saveErr=false,tmark=null,lastAct=Date.now(),fails=0,lockUntil=0,svT=null;
if(store.cur)S=store.list.find(x=>x.id===store.cur)||null;
function save(touch){if(S&&touch!==false)S.updated=new Date().toISOString();if(CLOUD&&S&&touch!==false)schedulePush(S);try{localStorage.setItem(LS,JSON.stringify(store));saveErr=false}catch(e){saveErr=true}$('#warn').innerHTML=saveErr?'<div class="banner pend"><b>No se pudo guardar en este dispositivo.</b> Exporte la evidencia (JSON) ahora para no perder datos.</div>':''}
function newEval(p){return{id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),v:VERSION,created:new Date().toISOString(),updated:null,person:p,a:{},assist:{},rub:{},confirm:{},perm:{},time:{},adv:{},plan:{},snap:null,delivered:null}}
const rc=()=>ROLE[S.person.role]||ROLE.coordinator, required=id=>rc().req[id]||0;
const modsAll=id=>id==='excel'?Array.from({length:10},(_,i)=>'x'+(i+1)):defs[id].qs.map(q=>q.id);
const ans=k=>{const v=S.a[k];return v!==undefined&&String(v).trim()!==''};
function prog(id){const ks=modsAll(id),n=ks.filter(ans).length;return n===0?0:n===ks.length?2:1}
function pct(){let t=0,n=0;rc().mods.forEach(m=>{const ks=modsAll(m);t+=ks.length;n+=ks.filter(ans).length});return t?Math.round(n/t*100):0}
const rubKeys=id=>defs[id].rub.map((_,i)=>id+i), rated=id=>rubKeys(id).every(k=>S.rub[k]!==undefined&&S.rub[k]!=='');
const factor=k=>{const z=S.assist[k]||'autonomo';return z==='autonomo'?1:z==='pista'?.75:z==='ayuda'?.4:0};
const al=k=>(AS.find(a=>a[0]===(S.assist[k]||'autonomo'))||[0,''])[1];
const lv=s=>s>=80?3:s>=60?2:s>=35?1:0;
const st=l=>l===3?'Competencia demostrada':l===2?'Ejecuta con apoyo':l===1?'Base insuficiente para autonomía':'No demostrado durante la evaluación';

/* ---------- tiempo ---------- */
function endTick(){if(tmark&&S){S.time[tmark.m]=(S.time[tmark.m]||0)+Math.min((Date.now()-tmark.t)/1000,1800)}tmark=null}
function startTick(){tmark=(S&&V.view==='mod')?{m:V.mod,t:Date.now()}:null}

/* ---------- calificación (solo modo evaluador) ---------- */
function xok(k){const e=KEYS.excel.exp[k],v=S.a[k];if(!ans(k))return false;switch(KEYS.excel.type[k]){case'int':return ints(v)[0]===e;case'dec':return Math.abs(dec(v)-e)<=.051;case'txt':return norm(v).includes(norm(e));case'pair':{const n=ints(v);return n[0]===e[0]&&n[1]===e[1]}case'proj':return norm(v).includes(norm(e[0]))&&ints(v)[0]===e[1]}return false}
const xkeys=['x1','x2','x3','x4','x5','x6','x7','x8','x9'];
const mcqOk=q=>ans(q.id)&&+S.a[q.id]===KEYS.mcq[q.id];
function evaluate(id){
 const req=required(id),touched=prog(id)>0,r={id,name:defs[id].title,req,touched,pending:false,score:null,got:null,label:'',cls:'muted',e:'Caso + respuesta + rúbrica + autonomía',raw:null};
 if(!touched){r.label='No evaluado';return r}
 if(prog(id)<2){r.pending=true;r.label='Incompleto (faltan respuestas)';r.cls='warn';return r}
 if(!rated(id)){r.pending=true;r.label='Pendiente de calificar';r.cls='warn';return r}
 let score;
 if(id==='excel'){const okn=xkeys.filter(xok).length,w=xkeys.reduce((n,k)=>n+(xok(k)?factor(k):0),0)/9,rb=(+S.rub.excel0+ +S.rub.excel1)/4*factor('x10');score=Math.round((w*.8+rb*.2)*100);r.raw=Math.round(okn/9*100);r.e='Exactitud '+r.raw+'% · autonomía por tarea'}
 else{const d=defs[id],mq=d.qs.filter(q=>q.t==='m'),obj=mq.length?mq.filter(mcqOk).length/mq.length:1,rub=rubKeys(id).reduce((n,k)=>n+ +S.rub[k],0)/(d.rub.length*2);score=Math.round((obj*.35+rub*.65)*100*factor(id))}
 r.score=score;r.got=lv(score);
 const adv=S.adv[id]||{};
 if(r.got>=req&&req<4){r.label='Competencia demostrada';r.cls='good'}
 else if(req===4&&r.got===3){if(adv.state==='ok'){r.label='Competencia demostrada (nivel 4 validado)';r.cls='good'}else if(adv.state==='no'){r.label='Nivel 4 no validado';r.cls='bad'}else{r.label='Validación avanzada pendiente';r.cls='warn'}}
 else{r.label=st(r.got);r.cls='bad'}
 return r}
const isGap=r=>r.touched&&!r.pending&&r.cls!=='good';


/* ---------- nube (Supabase): la sesión vive solo en memoria y solo en modo evaluador ---------- */
const allEvals=()=>{const m=new Map();Object.values(REMOTE).forEach(e=>m.set(e.id,e));store.list.forEach(e=>{const r=m.get(e.id);if(!r||(e.updated||e.created)>=(r.updated||r.created))m.set(e.id,e)});return[...m.values()]};
const findEval=id=>store.list.find(x=>x.id===id)||REMOTE[id]||null;
async function authCall(grant,body){const r=await fetch(SB.url+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(r.status===400?'Correo o contraseña incorrectos.':(j.error_description||j.msg||j.message||'No se pudo iniciar sesión.'));return j}
async function sbRefresh(){const j=await authCall('refresh_token',{refresh_token:CLOUD.refresh});CLOUD.token=j.access_token;CLOUD.refresh=j.refresh_token}
async function sb(path,o={}){
 const h={apikey:SB.key,'Content-Type':'application/json'};if(CLOUD)h.Authorization='Bearer '+CLOUD.token;if(o.prefer)h.Prefer=o.prefer;
 const r=await fetch(SB.url+path,{method:o.method||'GET',headers:h,body:o.body===undefined?undefined:JSON.stringify(o.body)});
 if(r.status===401&&CLOUD&&CLOUD.refresh&&!o.retried){await sbRefresh();return sb(path,Object.assign({},o,{retried:true}))}
 if(!r.ok){let m='';try{const j=await r.json();m=j.message||j.msg||''}catch(e){}throw new Error(m||'HTTP '+r.status)}
 const t=await r.text();return t?JSON.parse(t):null}
async function sbLogin(email,pw){
 const j=await authCall('password',{email,password:pw});
 CLOUD={token:j.access_token,refresh:j.refresh_token,email:j.user.email,uid:j.user.id,admin:false};
 let ev;try{ev=await sb('/rest/v1/asm_evaluators?select=is_admin')}catch(e){CLOUD=null;throw e}
 if(!ev||!ev.length){CLOUD=null;throw new Error('Su usuario no está autorizado como evaluador de este assessment.')}
 CLOUD.admin=!!ev[0].is_admin}
const rowOf=e=>({id:e.id,person_name:e.person.name,person_code:e.person.id||null,role:e.person.role,evaluator_name:e.person.evaluator||null,app_version:e.v||VERSION,consent:!!e.person.consent,data:e,created_at:e.created,delivered_at:e.delivered||null});
async function pushEval(e){
 await sb('/rest/v1/asm_evaluations?on_conflict=id',{method:'POST',prefer:'resolution=merge-duplicates,return=minimal',body:rowOf(e)});
 if(e.snap){const rows=Object.entries(e.snap.scores).map(([m,s])=>({evaluation_id:e.id,module:m,level_got:s.got,level_req:s.req,score:s.score,pending:!!s.pending,touched:!!s.touched,label:s.label||null,evaluated_at:e.snap.date}));if(rows.length)await sb('/rest/v1/asm_results?on_conflict=evaluation_id,module',{method:'POST',prefer:'resolution=merge-duplicates,return=minimal',body:rows})}
 if(REMOTE[e.id]!==e)REMOTE[e.id]=JSON.parse(JSON.stringify(e))}
function showCloud(){const el=$('#cloudst');if(el){el.textContent=cloudMsg;el.className=cloudErr?'err':'muted'}}
function schedulePush(e){clearTimeout(pushT);pushT=setTimeout(async()=>{if(!CLOUD)return;try{await pushEval(e);cloudErr=false;cloudMsg='Guardado en la nube '+new Date().toLocaleTimeString('es-CR')+'.'}catch(err){cloudErr=true;cloudMsg='No se pudo guardar en la nube: '+err.message}showCloud()},4000)}
async function sbSync(){
 const rows=await sb('/rest/v1/asm_evaluations?select=data&order=updated_at.desc');
 REMOTE={};(rows||[]).forEach(r=>{if(r.data&&r.data.id)REMOTE[r.data.id]=r.data});
 let up=0,down=0;
 for(let i=0;i<store.list.length;i++){const L=store.list[i],R=REMOTE[L.id],lt=L.updated||L.created;
  if(!R||lt>(R.updated||R.created)){await pushEval(L);up++}
  else if((R.updated||R.created)>lt){store.list[i]=R;if(S&&S.id===L.id)S=R;down++}}
 save(false);
 const only=Object.keys(REMOTE).filter(id=>!store.list.some(x=>x.id===id)).length;
 cloudMsg='Sincronizado: '+up+' enviada(s), '+down+' actualizada(s) desde la nube, '+only+' solo en la nube.';cloudErr=false}
function cloudCard(){
 if(CLOUD)return `<div class="card no-print"><h3>Nube (Supabase)</h3><p>Conectado como <b>${esc(CLOUD.email)}</b> · ${CLOUD.admin?'administrador (ve todas las evaluaciones)':'evaluador (ve solo las suyas)'}.</p><p id="cloudst" class="${cloudErr?'err':'muted'}">${esc(cloudMsg)}</p><div class="actions"><button class="btn" data-act="cloudSync">Sincronizar ahora</button><button class="btn secondary" data-act="freeLocal">Quitar de este dispositivo lo ya sincronizado</button><button class="btn secondary" data-act="cloudLogout">Cerrar sesión de la nube</button></div></div>`;
 return `<div class="card no-print"><h3>Nube (Supabase)</h3><p class="muted">Inicie sesión con su usuario de evaluador para guardar y consultar las evaluaciones en la nube. La sesión solo existe mientras el modo evaluador esté activo y no se guarda en el navegador.</p><div class="grid"><div class="field"><label for="cl_email">Correo</label><input type="text" id="cl_email" inputmode="email" autocomplete="username"></div><div class="field"><label for="cl_pw">Contraseña</label><input type="password" id="cl_pw" autocomplete="current-password"></div></div><div id="cloudst" class="${cloudErr?'err':'muted'}">${esc(cloudMsg)}</div><div class="actions"><button class="btn" data-act="cloudLogin">Conectar y sincronizar</button></div></div>`}

/* ---------- vistas ---------- */
function render(){
 if(['report','cons'].includes(V.view)&&!EV)V.view='home';
 if(['mod','deliver','report','data'].includes(V.view)&&!S&&V.view!=='data')V.view='home';
 renderHeader();const m=$('#main');
 m.innerHTML=V.view==='home'?homeView():V.view==='data'?dataView():V.view==='mod'?modPage(V.mod):V.view==='deliver'?deliverView():V.view==='report'?reportView():consView();
}
function renderHeader(){
 const b=['<button class="hb" data-act="home">Inicio</button>'];
 if(S)b.push('<button class="hb" data-act="data">Datos</button>');
 b.push(EV?'<button class="hb on" data-act="lock">🔓 Evaluador'+(CLOUD?' ☁':'')+' · Salir</button>':'<button class="hb" data-act="unlock">🔒 Modo evaluador</button>');
 $('#hbtns').innerHTML=b.join('')}
function go(view,mod){endTick();V={view,mod:mod||null};render();startTick();window.scrollTo(0,0)}
function navInner(active){
 const it=rc().mods.map(m=>{const p=prog(m);return `<button class="btn ${m===active?'active':'secondary'}" data-act="mod" data-arg="${m}">${p===2?'✓ ':p===1?'◐ ':''}${esc(label(m))}</button>`});
 it.push(EV?`<button class="btn ${active==='report'?'active':'secondary'}" data-act="report">Resultado</button>`:`<button class="btn ${active==='deliver'?'active':'secondary'}" data-act="deliver">Entregar</button>`);
 return `<div class="nav no-print">${it.join('')}</div><div class="progress" title="Avance ${pct()}%"><div style="width:${pct()}%"></div></div>`}
function refreshNav(){const w=$('#navwrap');if(!w)return;const t=document.createElement('div');t.innerHTML=navInner(V.view==='mod'?V.mod:V.view);const nb=t.querySelectorAll('.btn'),ob=w.querySelectorAll('.btn');if(nb.length!==ob.length){w.innerHTML=t.innerHTML;return}nb.forEach((b,i)=>{if(ob[i].className!==b.className)ob[i].className=b.className;if(ob[i].textContent!==b.textContent)ob[i].textContent=b.textContent});const pb=w.querySelector('.progress>div'),np=t.querySelector('.progress>div');if(pb&&np)pb.style.width=np.style.width}

function homeView(){
 if(!EV){const cur=S;return `<div class="card"><h2>Assessment Integral de Competencias</h2>${homeMsg?`<div class="banner ok">${esc(homeMsg)}</div>`:''}<p>Esta evaluación mide <b>qué puede hacer la persona sin ayuda</b>, cómo analiza situaciones reales y dónde necesita desarrollo. Puede realizarse por módulos y continuar después.</p><div class="actions">${cur?`<button class="btn" data-act="resume">Continuar evaluación de ${esc(cur.person.name)}</button>`:''}<button class="btn ${cur?'secondary':''}" data-act="newEval">Nueva evaluación</button></div></div>`}
 const rows=allEvals().sort((a,b)=>(b.updated||b.created).localeCompare(a.updated||a.created)).map(e=>{const prev=S;S=e;const p=pct(),rl=rc().label;S=prev;
  return `<tr><td><b>${esc(e.person.name)}</b><div class="muted">${esc(e.person.id||'')}</div></td><td>${esc(rl)}</td><td>${esc(e.person.evaluator||'')}</td><td>${p}%</td><td>${e.delivered?'Entregada':'En curso'}</td><td>${(()=>{const l=store.list.some(x=>x.id===e.id),r=!!REMOTE[e.id];return l&&r?'Local + nube':l?'Solo local':'Solo nube'})()}</td><td>${fmtD(e.updated||e.created)}</td><td class="no-print"><button class="btn small" data-act="open" data-arg="${e.id}">Abrir</button> <button class="btn small secondary" data-act="reportOf" data-arg="${e.id}">Informe</button> <button class="btn small secondary" data-act="exportOne" data-arg="${e.id}">JSON</button> <button class="btn small danger" data-act="del" data-arg="${e.id}">Eliminar</button></td></tr>`}).join('');
 return `<div class="card"><h2>Evaluaciones en este dispositivo</h2>${homeMsg?`<div class="banner ok">${esc(homeMsg)}</div>`:''}<div class="actions" style="margin:0 0 12px"><button class="btn" data-act="newEval">Nueva evaluación</button><button class="btn secondary" data-act="cons">Consolidado</button><button class="btn secondary" data-act="import">Importar JSON</button><button class="btn secondary" data-act="exportAll">Exportar todo</button></div>${rows?`<div class="tscroll"><table><tr><th>Persona</th><th>Puesto</th><th>Evaluador</th><th>Avance</th><th>Estado</th><th>Origen</th><th>Actualizada</th><th></th></tr>${rows}</table></div>`:'<p class="muted">Aún no hay evaluaciones guardadas en este dispositivo.</p>'}</div>
 ${cloudCard()}<div class="card no-print"><h3>Seguridad del modo evaluador</h3><p class="muted">Las respuestas correctas y las anclas de rúbrica están cifradas con el PIN. Para cambiarlo, escriba uno nuevo (mínimo 8 caracteres); se descargará un <b>index.html</b> actualizado que debe publicar en lugar del actual.</p><div class="grid"><div class="field"><label for="np">Nuevo PIN</label><input type="password" id="np" autocomplete="off"></div></div><div id="npmsg" class="err"></div><div class="actions"><button class="btn secondary" data-act="changePin">Generar index.html con nuevo PIN</button></div></div>`}

function dataView(){
 const p=S?S.person:{role:'coordinator',evaluator:store.lastEv||''};
 return `<div class="card"><h2>${S?'Datos de la evaluación':'Inicio de evaluación'}</h2><p>Esta evaluación mide <b>qué puede hacer la persona sin ayuda</b>, cómo analiza situaciones reales y dónde necesita desarrollo. Puede realizarse por módulos y continuar después.</p>
 <div class="note"><b>Ruta por puesto:</b> Líder evalúa conducción del turno y ejecución; Supervisor añade control del servicio y personas; Coordinador incorpora gestión integral; Project Manager añade exigencia avanzada en negocio, cliente, finanzas, KPI, personas, operación y contrato.</div>
 <div class="grid"><div class="field"><label for="f_name">Nombre *</label><input type="text" id="f_name" value="${esc(p.name)}"></div><div class="field"><label for="f_id">Cédula / código</label><input type="text" id="f_id" value="${esc(p.id)}"></div><div class="field"><label for="f_ev">Evaluador *</label><input type="text" id="f_ev" value="${esc(p.evaluator)}"></div><div class="field"><label for="f_role">Puesto a evaluar</label><select id="f_role">${Object.entries(ROLE).map(([k,r])=>`<option value="${k}" ${(p.role||'coordinator')===k?'selected':''}>${esc(r.label)}</option>`).join('')}</select></div></div>
 <div class="note"><b>Regla:</b> una respuesta correcta con ayuda no equivale a autonomía. El evaluador debe registrar la ayuda utilizada. La dificultad debe estar en el análisis, no en entender instrucciones confusas.</div>
 <label class="chk"><input type="checkbox" id="f_consent" ${S&&S.person.consent?'checked':''}> <span>Consiento que mis resultados se usen únicamente para evaluar mis competencias y definir mi plan de desarrollo en la empresa. Los datos se guardan en este dispositivo y los maneja el evaluador. <span class="muted">(Texto sugerido: valídelo con RH/legal conforme a la Ley 8968.)</span></span></label>
 <div id="f_err" class="err"></div><div class="actions"><button class="btn" data-act="saveData">${S?'Guardar cambios':'Iniciar'}</button>${S?'<button class="btn secondary" data-act="resume">Cancelar</button>':''}</div></div>`}

function mcq(q){const p=(S.perm[q.id]??=shuf(q.o.length));return `<div class="opts" role="radiogroup" aria-label="${esc(q.p)}">${p.map(oi=>`<label><input type="radio" name="${q.id}" value="${oi}" data-k="a:${q.id}" ${String(S.a[q.id])===String(oi)?'checked':''}> ${esc(q.o[oi])}</label>`).join('')}</div>`}
function shuf(n){const a=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function assistSel(k){const z=S.assist[k]||'autonomo';return `<select data-k="assist:${k}" aria-label="Ayuda utilizada">${AS.map(([v,l])=>`<option value="${v}" ${z===v?'selected':''}>${l}</option>`).join('')}</select>`}
function rubSel(k){const z=S.rub[k];return `<select data-k="rub:${k}" aria-label="Calificación"><option value="">Calificar…</option>${[['2','2 · Demostrado'],['1','1 · Parcial'],['0','0 · No demostrado']].map(([v,l])=>`<option value="${v}" ${z===v?'selected':''}>${l}</option>`).join('')}</select>`}
function rubRows(id){return defs[id].rub.map((r,i)=>`<div class="rubrow"><div><b>${esc(r)}</b><div class="muted">${esc(KEYS.anchors[id][i])}</div></div>${rubSel(id+i)}</div>`).join('')}
function modPage(id){
 if(!rc().mods.includes(id))id=V.mod=rc().mods[0];
 return `<div id="navwrap">${navInner(id)}</div>`+(id==='excel'?excelPage():genericPage(id))}
function qEval(q){if(q.t==='t')return `<div class="evq"><b>Respuesta de referencia:</b> ${esc(KEYS.ideal[q.id])}</div>`;return `<div class="evq">Esperada: <b>${esc(q.o[KEYS.mcq[q.id]])}</b> — ${ans(q.id)?(mcqOk(q)?'<span class="good">✓ correcta</span>':'<span class="bad">✗ incorrecta</span>'):'sin responder'}</div>`}
function genericPage(id){
 const d=defs[id],ev=EV&&KEYS;
 return `<div class="card"><h2>${esc(d.title)} <span class="pill">${minOf(id)} min</span></h2><div class="steps"><b>Instrucciones:</b> lea primero la situación completa. Responda con lo que usted haría. Si necesita ayuda, pídala al evaluador: no hay premio por responder rápido ni castigo por pedir ayuda.</div><div class="scenario">${esc(d.scenario)}</div>
 ${d.qs.map((q,i)=>`<div class="q"><b>${i+1}.</b> ${esc(q.p)}${q.t==='m'?mcq(q):`<textarea data-k="a:${q.id}" placeholder="Explique con sus propias palabras." aria-label="${esc(q.p)}">${esc(S.a[q.id]||'')}</textarea>`}${ev?qEval(q):''}</div>`).join('')}
 ${ev?`<div class="evpanel no-print"><h3>Panel del evaluador</h3><div class="field"><label>Ayuda general utilizada en este módulo</label>${assistSel(id)}</div>${S.person.role==='pm'&&required(id)===4?'<div class="note"><b>PM · evidencia avanzada:</b> el examen puede demostrar autonomía (nivel 3). Para nivel 4 registre la validación en el informe.</div>':''}<p class="muted">Rúbrica: 2 = demostrado, 1 = parcial, 0 = no demostrado. Califique todos los criterios para obtener resultado.</p>${rubRows(id)}</div>`:`<div class="note no-print">Al terminar este módulo, continúe con el siguiente. Si necesita ayuda, pídala al evaluador.</div>`}</div>`}
function excelPage(){
 const c=S.confirm.excel,ev=EV&&KEYS;
 const task=(i,q)=>{const k='x'+(i+1);const inp=i===9?`<textarea data-k="a:${k}" aria-label="${esc(q)}">${esc(S.a[k]||'')}</textarea>`:`<input type="text" data-k="a:${k}" value="${esc(S.a[k]??'')}" aria-label="${esc(q)}">`;
  let side='';
  if(ev){if(i<9){const ok=xok(k),h=!ok&&ans(k)?(KEYS.excel.diag[k]||{})[String(ints(S.a[k])[0])]:'';side=`<div><label class="lbl">Ayuda utilizada</label>${assistSel(k)}<div class="muted">${ok?'<span class="good">✓ correcta</span>':'<span class="bad">✗</span> Esperado: '+esc(KEYS.excel.show[k])}${h?'<br><b>'+esc(h)+'</b>':''}</div></div>`}else side=`<div><label class="lbl">Ayuda utilizada</label>${assistSel(k)}</div>`}
  return `<div class="q"><b>Tarea ${i+1}.</b> ${esc(q)}<div class="${ev?'helpgrid':''}"><div>${inp}</div>${side}</div>${ev&&i===9?`<div class="evq"><b>Referencia:</b> ${esc(KEYS.excel.ideal10)}</div><div class="evpanel no-print">${rubRows('excel')}</div>`:''}</div>`};
 return `<div class="card"><h2>Excel Operativo <span class="pill">35 min</span></h2><div class="steps"><b>Haga esto antes de responder:</b><ol><li>Descargue y abra el Excel.</li><li>Lea completa la hoja <b>Instrucciones</b>.</li><li>Realice las 10 tareas en Datos_Personal.</li><li>Guarde el archivo con su nombre.</li><li>Regrese aquí y registre sus resultados.</li></ol></div><p><a href="V7.4_Campo_Excel_Operativo.xlsx" download><b>⬇ Descargar Excel V7.4</b></a></p><label class="chk"><input type="checkbox" data-k="confirm:excel" data-re="1" ${c?'checked':''}> <span>Confirmo que abrí el archivo y leí las instrucciones.</span></label><div class="${c?'':'hidden'}">${excelQ.map((q,i)=>task(i,q)).join('')}</div></div>`}

function deliverView(){
 const items=rc().mods.map(m=>{const p=prog(m);return `<tr><td>${esc(label(m))}</td><td class="${p===2?'good':p===1?'warn':'bad'}"><b>${p===2?'Completo':p===1?'Parcial':'Sin responder'}</b></td></tr>`}).join('');
 return `<div id="navwrap">${navInner('deliver')}</div><div class="card"><h2>Entrega de la evaluación</h2><p>Revise que todos los módulos estén completos. Al entregar, el dispositivo pasa al evaluador.</p><div class="tscroll"><table><tr><th>Módulo</th><th>Estado</th></tr>${items}</table></div><div class="actions"><button class="btn" data-act="doDeliver">Entregar evaluación</button></div></div>`}

/* ---------- informe (evaluador) ---------- */
function reportView(){
 const R=rc().mods.map(evaluate),done=R.filter(r=>r.touched&&!r.pending),pend=R.filter(r=>r.pending),na=R.filter(r=>!r.touched);
 S.snap={date:new Date().toISOString(),role:S.person.role,scores:Object.fromEntries(R.map(r=>[r.id,{got:r.got,req:r.req,pending:r.pending,touched:r.touched,label:r.label,score:r.score}]))};save();
 const total=Object.values(S.time||{}).reduce((a,b)=>a+b,0);
 const banner=(pend.length||na.length)?`<div class="banner pend"><b>Evaluación incompleta.</b> ${done.length} de ${R.length} módulos calificados.${pend.length?'<br>Pendientes: '+pend.map(r=>esc(label(r.id))+' ('+esc(r.label.toLowerCase())+')').join(', ')+'.':''}${na.length?'<br>Sin evaluar: '+na.map(r=>esc(label(r.id))).join(', ')+'.':''}<br>Los módulos pendientes o sin evaluar <b>no</b> se interpretan como “no demostrado”.</div>`:'<div class="banner ok"><b>Evaluación completa:</b> todos los módulos del puesto están calificados.</div>';
 const rows=R.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.e)}</td><td>${r.score===null?'—':r.score+'%'}</td><td>${r.got===null?'—':r.got+'/3'}</td><td>${r.req}</td><td class="${r.cls}"><b>${esc(r.label)}</b></td><td>${fmtMin(S.time[r.id])}</td></tr>`).join('');
 return `<div id="navwrap">${navInner('report')}</div><div class="card"><h2>Informe Individual de Competencias</h2><p><b>${esc(S.person.name)}</b> · ${esc(rc().label)}</p><p class="muted">Evaluador: ${esc(S.person.evaluator||'—')} · Código: ${esc(S.person.id||'—')} · Iniciada: ${fmtD(S.created)} · Tiempo aprox.: ${fmtMin(total)} · Versión ${esc(VERSION)}</p>${banner}
 <div class="tscroll"><table><tr><th>Competencia</th><th>Evidencia</th><th>Resultado</th><th>Nivel examen</th><th>Nivel requerido</th><th>Interpretación</th><th>Tiempo</th></tr>${rows}</table></div>
 <div class="note"><b>Importante:</b> “No demostrado durante la evaluación” describe esta sesión. La ayuda observada forma parte del diagnóstico. Una respuesta correcta con ayuda no equivale a autonomía.</div>
 ${advSection(R)}${nextRole()}${planSection(R)}<h3>Detalle completo de evidencia</h3>${detailSection()}
 <div class="actions no-print"><button class="btn" onclick="window.print()">Imprimir / guardar PDF detallado</button><button class="btn secondary" data-act="exportOne" data-arg="${S.id}">Exportar evidencia JSON</button><button class="btn secondary" data-act="home">Volver al listado</button></div></div>`}
function advSection(R){
 const L=R.filter(r=>r.req===4&&r.got===3);if(!L.length)return '';
 return `<h3>Validación avanzada (nivel 4)</h3><p class="muted">El examen demuestra autonomía (nivel 3). El nivel 4 exige evidencia en site: mejora sostenida, manejo de casos complejos o desarrollo de otros.</p>${L.map(r=>{const a=S.adv[r.id]||{};return `<div class="feedback"><b>${esc(r.name)}</b><div class="grid" style="margin-top:8px"><div class="field"><label>Estado</label><select data-k="adv:${r.id}:state" data-re="1"><option value="" ${!a.state?'selected':''}>Pendiente</option><option value="ok" ${a.state==='ok'?'selected':''}>Validado</option><option value="no" ${a.state==='no'?'selected':''}>No validado</option></select></div><div class="field"><label>Validador</label><input type="text" data-k="adv:${r.id}:validator" value="${esc(a.validator||'')}"></div><div class="field"><label>Fecha</label><input type="date" data-k="adv:${r.id}:date" value="${esc(a.date||'')}"></div></div><div class="field" style="margin-top:8px"><label>Evidencia (casos, mejora sostenida, personas desarrolladas)</label><textarea data-k="adv:${r.id}:evidence">${esc(a.evidence||'')}</textarea></div></div>`}).join('')}`}
function nextRole(){
 const nx=NEXT[S.person.role];if(!nx)return '<h3>Preparación para el siguiente puesto</h3><p class="muted">Este puesto es el nivel más alto de la ruta evaluada.</p>';
 const N=ROLE[nx];let met=0;const gaps=[],unk=[],adv=[];
 N.mods.forEach(m=>{const need=N.req[m],r=evaluate(m);if(!r.touched||r.pending)unk.push(m);else if(r.got>=need)met++;else if(need===4&&r.got===3)adv.push(m);else gaps.push(`${label(m)} (${r.got}/${need})`)});
 const p=Math.round(met/N.mods.length*100);
 return `<h3>Preparación para ${esc(N.label)}</h3><div class="feedback"><b>${met} de ${N.mods.length} competencias</b> del puesto siguiente ya cumplen el nivel requerido (${p}%).${gaps.length?'<br><b>Brechas:</b> '+esc(gaps.join(', '))+'.':''}${adv.length?'<br><b>Requieren validación nivel 4:</b> '+esc(adv.map(label).join(', '))+'.':''}${unk.length?'<br><b>Sin evidencia completa:</b> '+esc(unk.map(label).join(', '))+'.':''}</div>`}
function planSection(R){
 const G=R.filter(isGap);if(!G.length)return '<h3>Plan de desarrollo</h3><p>No se identificaron brechas para el nivel requerido del puesto. Revise igualmente ayudas y rúbricas.</p>';
 const d90=new Date(Date.now()+90*864e5).toISOString().slice(0,10);
 const rows=G.map(r=>{const g=r.req===4&&r.got===3?'Autonomía demostrada; requiere validación nivel 4.':`${st(r.got)} (nivel ${r.got} de ${r.req} requerido).`;const p=S.plan[r.id]||{};
  return `<tr><td><b>${esc(r.name)}</b><div class="muted">${esc(g)}</div></td><td>${esc(PLAN[r.id])}</td><td><input type="text" data-k="plan:${r.id}:owner" value="${esc(p.owner||'')}" aria-label="Responsable"></td><td><input type="date" data-k="plan:${r.id}:date" value="${esc(p.date||'')}" aria-label="Fecha límite"></td></tr>`}).join('');
 return `<h3>Plan de desarrollo</h3><div class="tscroll"><table><tr><th>Competencia y brecha</th><th>Acción sugerida</th><th>Responsable</th><th>Fecha límite</th></tr>${rows}</table></div><p class="muted">Reevaluación sugerida: ${esc(d90)} (≈ 90 días).</p>`}
function detailSection(){
 const ex=rc().mods.includes('excel')?`<div class="detail"><h4>Excel Operativo</h4><div class="body">${xkeys.map((k,i)=>{const ok=xok(k),h=!ok&&ans(k)?(KEYS.excel.diag[k]||{})[String(ints(S.a[k])[0])]:'';return `<div class="feedback"><b>Tarea ${i+1}</b> · ${ok?'Correcta':'Revisar'} · ${esc(al(k))}<br><b>Respuesta:</b> ${esc(ans(k)?S.a[k]:'Sin respuesta')}${ok?'':`<br><b>Esperado:</b> ${esc(KEYS.excel.show[k])}`}${h?'<br><b>'+esc(h)+'</b>':''}</div>`}).join('')}<div class="feedback"><b>Análisis final (tarea 10):</b> ${esc(S.a.x10||'Sin respuesta')}<br><b>Rúbrica:</b> ${defs.excel.rub.map((r,i)=>esc(r)+': '+rl(S.rub['excel'+i])).join(' · ')}</div></div></div>`:'';
 return ex+rc().mods.filter(id=>id!=='excel').map(id=>{const d=defs[id];return `<div class="detail"><h4>${esc(d.title)}</h4><div class="body">${d.qs.map(q=>`<div class="feedback"><b>${esc(q.p)}</b><br><b>Respuesta:</b> ${q.t==='m'?(ans(q.id)?esc(q.o[+S.a[q.id]]):'Sin respuesta'):esc(S.a[q.id]||'Sin respuesta')}${q.t==='m'&&ans(q.id)&&!mcqOk(q)?`<br><b>Respuesta esperada:</b> ${esc(q.o[KEYS.mcq[q.id]])}`:''}</div>`).join('')}<b>Autonomía:</b> ${esc(al(id))}<br><b>Rúbrica:</b> ${d.rub.map((r,i)=>esc(r)+': '+rl(S.rub[id+i])).join(' · ')}</div></div>`}).join('')}
const rl=v=>v==='2'?'Demostrado':v==='1'?'Parcial':v==='0'?'No demostrado':'Sin calificar';

/* ---------- consolidado ---------- */
function consView(){
 const L=allEvals().filter(e=>e.snap);
 if(!L.length)return `<div class="card"><h2>Consolidado</h2><p class="muted">Aún no hay resultados. Abra el informe de cada persona para registrar su resultado en el consolidado.</p><div class="actions"><button class="btn secondary" data-act="home">Volver</button></div></div>`;
 const cell=(s)=>{if(!s||!s.touched)return '<td class="c-na">—</td>';if(s.pending)return '<td class="c-na" title="Pendiente">…</td>';const c=s.got>=s.req?'c-good':(s.req===4&&s.got===3?'c-warn':'c-bad');return `<td class="${c}" title="${esc(s.label)}">${s.got}/${s.req}</td>`};
 const rows=L.map(e=>`<tr><td style="text-align:left"><b>${esc(e.person.name)}</b><div class="muted">${esc(ROLE[e.person.role].label)} · ${fmtD(e.snap.date)}</div></td>${M.map(m=>cell(e.snap.scores[m[0]])).join('')}</tr>`).join('');
 const cnt=M.map(m=>{const g=L.filter(e=>{const s=e.snap.scores[m[0]];return s&&s.touched&&!s.pending&&!(s.got>=s.req)}).length;return[m[0],g]}).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,5);
 return `<div class="card"><h2>Consolidado de competencias</h2><p class="muted">Celda = nivel obtenido / nivel requerido. Verde: cumple · Rojo: brecha · Ámbar: validación nivel 4 pendiente · Gris: sin evidencia completa. Los datos corresponden al último informe abierto de cada persona.</p><div class="tscroll"><table class="hm"><tr><th>Persona</th>${M.map(m=>`<th title="${esc(m[1])}">${esc(m[1].split('/')[0].slice(0,9))}</th>`).join('')}</tr>${rows}</table></div>
 <h3>Brechas más frecuentes</h3>${cnt.length?'<ol>'+cnt.map(c=>`<li>${esc(label(c[0]))}: ${c[1]} persona(s)</li>`).join('')+'</ol>':'<p>Sin brechas registradas.</p>'}<div class="actions no-print"><button class="btn secondary" data-act="consCsv">Exportar CSV</button><button class="btn secondary" data-act="home">Volver</button></div></div>`}

/* ---------- acciones ---------- */
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
const safe=s=>String(s||'persona').replace(/[^\w.-]+/g,'_');
function setCur(id){S=findEval(id);store.cur=(S&&store.list.includes(S))?S.id:null;save(false)}
function openUnlock(){const m=$('#modal');m.innerHTML='<div class="mbox" role="dialog" aria-modal="true" aria-label="Modo evaluador"><h3>Modo evaluador</h3><p class="muted">Ingrese el PIN del evaluador.</p><input type="password" id="pin" autocomplete="off" aria-label="PIN"><div id="pinerr" class="err"></div><div class="actions"><button class="btn" data-act="submitUnlock">Entrar</button><button class="btn secondary" data-act="closeModal">Cancelar</button></div></div>';m.classList.remove('hidden');$('#pin').focus();$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')ACT.submitUnlock()})}
const ACT={
 home(){homeMsg='';go('home')},
 data(){go('data')},
 resume(){go('mod',rc().mods[0])},
 newEval(){endTick();S=null;store.cur=null;homeMsg='';go('data')},
 open(id){setCur(id);go('mod',rc().mods[0])},
 reportOf(id){setCur(id);go('report')},
 mod(m){go('mod',m)},
 report(){go('report')},
 deliver(){go('deliver')},
 doDeliver(){const inc=rc().mods.filter(m=>prog(m)<2).length;if(inc&&!confirm('Hay '+inc+' módulo(s) incompleto(s). ¿Entregar de todos modos?'))return;endTick();S.delivered=new Date().toISOString();save();store.cur=null;S=null;save();homeMsg='Evaluación entregada. Pase el dispositivo al evaluador.';go('home')},
 unlock(){openUnlock()},
 closeModal(){$('#modal').classList.add('hidden')},
 async submitUnlock(){
  if(Date.now()<lockUntil){$('#pinerr').textContent='Demasiados intentos. Espere '+Math.ceil((lockUntil-Date.now())/1000)+' s.';return}
  if(!(window.crypto&&crypto.subtle)){$('#pinerr').textContent='Este navegador no permite cifrado en esta página (use https).';return}
  try{KEYS=await decryptKeys($('#pin').value);EV=true;fails=0;lastAct=Date.now();ACT.closeModal();render()}
  catch(e){fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}$('#pinerr').textContent='PIN incorrecto.'}},
 async cloudLogin(){const em=$('#cl_email').value.trim(),pw=$('#cl_pw').value;if(!em||!pw){cloudErr=true;cloudMsg='Ingrese correo y contraseña.';return showCloud()}cloudErr=false;cloudMsg='Conectando…';showCloud();CLOUD=null;try{await sbLogin(em,pw);await sbSync()}catch(e){cloudErr=true;cloudMsg=e.message;REMOTE={}}render()},
 async cloudSync(){cloudErr=false;cloudMsg='Sincronizando…';showCloud();try{await sbSync()}catch(e){cloudErr=true;cloudMsg='Error de sincronización: '+e.message}render()},
 cloudLogout(){CLOUD=null;REMOTE={};cloudErr=false;cloudMsg='Sesión de la nube cerrada.';render()},
 freeLocal(){const L=store.list.filter(e=>e.delivered&&REMOTE[e.id]&&(REMOTE[e.id].updated||REMOTE[e.id].created)>=(e.updated||e.created));if(!L.length){cloudErr=false;cloudMsg='No hay evaluaciones entregadas y sincronizadas para quitar.';return render()}if(!confirm('Se quitarán de este dispositivo '+L.length+' evaluación(es) que ya están en la nube. Seguirán disponibles al conectarse. ¿Continuar?'))return;const ids=new Set(L.map(e=>e.id));store.list=store.list.filter(e=>!ids.has(e.id));if(store.cur&&ids.has(store.cur))store.cur=null;save(false);cloudErr=false;cloudMsg=L.length+' evaluación(es) quitadas de este dispositivo.';render()},
 lock(){KEYS=null;EV=false;CLOUD=null;REMOTE={};cloudMsg='';clearTimeout(pushT);homeMsg='';if(S&&(S.delivered||!store.list.includes(S))){S=null;store.cur=null;save(false)}go(['report','cons'].includes(V.view)?'home':V.view,V.mod)},
 saveData(){
  const name=$('#f_name').value.trim(),ev=$('#f_ev').value.trim(),role=$('#f_role').value,idc=$('#f_id').value.trim(),c=$('#f_consent').checked,er=$('#f_err');
  if(!name||!ev){er.textContent='Nombre y evaluador son obligatorios.';return}
  if(!c){er.textContent='Se requiere el consentimiento para continuar.';return}
  const p={name,id:idc,evaluator:ev,role,consent:true};store.lastEv=ev;
  if(S){S.person=Object.assign(S.person,p)}else{S=newEval(p);store.list.push(S);store.cur=S.id}
  save();go('mod',rc().mods[0])},
 import(){$('#imp').value='';$('#imp').click()},
 exportOne(id){const e=findEval(id);if(e)dl('V7.4_Evidencia_'+safe(e.person.id||e.person.name)+'.json',JSON.stringify(e,null,2),'application/json')},
 exportAll(){dl('V7.4_Evidencia_todas.json',JSON.stringify({v:VERSION,list:allEvals()},null,2),'application/json')},
 async del(id){const e=findEval(id);if(!e)return;if(!confirm('Se descargará una copia JSON y luego se eliminará la evaluación de '+e.person.name+' de este dispositivo'+(CLOUD?' y de la nube':' (si ya fue sincronizada, la copia en la nube se conserva hasta que la elimine conectado)')+'. ¿Continuar?'))return;ACT.exportOne(id);if(CLOUD){try{await sb('/rest/v1/asm_evaluations?id=eq.'+encodeURIComponent(id),{method:'DELETE'})}catch(err){alert('No se pudo eliminar en la nube: '+err.message);return}}delete REMOTE[id];store.list=store.list.filter(x=>x.id!==id);if(store.cur===id){store.cur=null}if(S&&S.id===id)S=null;save(false);render()},
 cons(){go('cons')},
 consCsv(){const L=allEvals().filter(e=>e.snap);const h=['Nombre','Código','Puesto','Evaluador','Fecha',...M.map(m=>m[1])];const rows=L.map(e=>[e.person.name,e.person.id||'',ROLE[e.person.role].label,e.person.evaluator||'',fmtD(e.snap.date),...M.map(m=>{const s=e.snap.scores[m[0]];return !s||!s.touched?'':s.pending?'pendiente':s.got+'/'+s.req})]);dl('V7.4_Consolidado.csv','\ufeff'+[h,...rows].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')},
 async changePin(){
  const np=$('#np').value,msg=$('#npmsg');msg.textContent='';
  if(np.length<8){msg.textContent='El PIN debe tener al menos 8 caracteres.';return}
  try{const blob=await encryptKeys(KEYS,np);const src=await (await fetch(location.href.split('#')[0],{cache:'no-store'})).text();
   const re=new RegExp('(const KEYS_'+'BLOB=")[A-Za-z0-9+/=]+(")');if(!re.test(src))throw new Error('x');
   dl('index.html',src.replace(re,(m,a,b)=>a+blob+b),'text/html');msg.className='muted';msg.textContent='Descargado. Publique este index.html en lugar del actual; el PIN anterior dejará de funcionar.'}
  catch(e){msg.className='err';msg.textContent='No se pudo generar el archivo (requiere abrir la app desde su sitio publicado, no desde un archivo local).'}}
};
document.addEventListener('click',e=>{lastAct=Date.now();const t=e.target.closest('[data-act]');if(!t)return;const f=ACT[t.dataset.act];if(f)f(t.dataset.arg,t)});
function setK(path,val){const p=path.split(':');let o=S;for(let i=0;i<p.length-1;i++)o=(o[p[i]]??={});o[p[p.length-1]]=val}
document.addEventListener('input',e=>{lastAct=Date.now();const t=e.target;if(!t.dataset||!t.dataset.k||!S)return;if(t.tagName==='TEXTAREA'||t.type==='text'){setK(t.dataset.k,t.value);clearTimeout(svT);svT=setTimeout(()=>{save();refreshNav()},300)}});
document.addEventListener('change',e=>{lastAct=Date.now();const t=e.target;if(!t.dataset||!t.dataset.k||!S)return;setK(t.dataset.k,t.type==='checkbox'?t.checked:t.value);save();if(t.dataset.re){render()}else refreshNav()});
$('#imp').addEventListener('change',async e=>{
 const f=e.target.files[0];if(!f)return;
 try{const j=JSON.parse(await f.text());const arr=Array.isArray(j)?j:j.list?j.list:[j];let n=0;
  arr.forEach(x=>{if(!x||!x.person||!x.a)return;if(!x.id)x.id='e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);['assist','rub','confirm','perm','time','adv','plan'].forEach(k=>x[k]=x[k]||{});const i=store.list.findIndex(y=>y.id===x.id);if(i>=0){if(confirm('Ya existe la evaluación de '+x.person.name+'. ¿Reemplazarla?')){store.list[i]=x;n++}}else{store.list.push(x);n++}});
  save();homeMsg=n+' evaluación(es) importada(s).';render()}
 catch(err){homeMsg='No se pudo leer el archivo JSON.';render()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){endTick();save(false)}else startTick()});
window.addEventListener('beforeunload',()=>{endTick();save(false)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='cl_pw')ACT.cloudLogin()});
setInterval(()=>{if(EV&&Date.now()-lastAct>10*60*1000){ACT.lock()}},30000);
render();
</script></body></html>
